# lhd for the BCM4773 on the NK 6.6 kernel.
#
# The hub has no flash: lhd powers it through bbd.0/nstandby, sends it
# the RAM patch below and starts its firmware on every boot. The patch
# is the SM-G920F one from Samsung's kernel source (bcm_sensorhub_a2,
# AsicVersion 0x47730A20); the 6.6 kernel has no /dev/bbd_patch.
PortName=tcp:127.0.0.1:300
FlpName=tcp
LheName=bbd
LheSerialControl=BBD:Serial=TTY
LheClockMHz=100

GpioNStdbyPath=/sys/devices/platform/bbd.0/nstandby

LhePatch=/vendor/etc/sensor/bcm4773_sensorhub.patch
LheBbdPacket=/dev/bbd_packet
LheBbdReliable=/dev/bbd_reliable
LheBbdControl=/dev/bbd_control
LheBbdSensor=/dev/bbd_sensor
LheDriverDebugFlags=PATCH_BBD:LHE_BBD

Lhe477xDebugFlags=RPC:FACILITY=65535-dKP+CUST+LHE:STDOUT_PUTS:STDOUT_LOG
LogEnabled=false
Log=JAVA
LogDirectory=/storage/emulated/0/gps/broadcom/storage
NvStorageDir=/data/vendor/gps/
LheSensorIpc=true

## MuxMode setting:
#ExtLNA for GNSS
LhePinMux=P17=M1
